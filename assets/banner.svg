<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .glitchA { animation: ga 3.4s infinite steps(1); }
    .glitchB { animation: gb 2.9s infinite steps(1); }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .rec { animation: recpulse 1.6s ease-in-out infinite; }
    .wire { animation: fadein 1.2s ease-out both; }
    @keyframes ga {
      0%, 91% { transform: translate(0,0); opacity: 0; }
      92% { transform: translate(-7px,-2px); opacity: .85; }
      94% { transform: translate(6px,1px); opacity: .6; }
      96%, 100% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes gb {
      0%, 87% { transform: translate(0,0); opacity: 0; }
      88% { transform: translate(7px,2px); opacity: .8; }
      92% { transform: translate(-5px,-1px); opacity: .55; }
      94%, 100% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes recpulse { 50% { opacity: .35; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0b1712"/>
      <stop offset="55%" stop-color="#060c09"/>
      <stop offset="100%" stop-color="#04070a"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="rgba(0,0,0,0.22)"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#bgGlow)"/>

  <g class="wire" stroke="#00ff88" stroke-opacity=".14" stroke-width="1">
    <line x1="60" y1="90" x2="180" y2="60"/><line x1="180" y1="60" x2="300" y2="105"/>
    <line x1="300" y1="105" x2="430" y2="55"/><line x1="600" y1="95" x2="720" y2="60"/>
    <line x1="720" y1="60" x2="845" y2="100"/><line x1="120" y1="220" x2="240" y2="250"/>
    <line x1="240" y1="250" x2="370" y2="215"/><line x1="640" y1="245" x2="760" y2="215"/>
    <line x1="760" y1="215" x2="850" y2="250"/>
  </g>
  <g class="wire" fill="#00ff88" fill-opacity=".55">
    <circle cx="60" cy="90" r="2.4"/><circle cx="180" cy="60" r="2"/><circle cx="300" cy="105" r="2.6"/>
    <circle cx="430" cy="55" r="2"/><circle cx="600" cy="95" r="2.4"/><circle cx="720" cy="60" r="2"/>
    <circle cx="845" cy="100" r="2.6"/><circle cx="120" cy="220" r="2"/><circle cx="240" cy="250" r="2.4"/>
    <circle cx="370" cy="215" r="2"/><circle cx="640" cy="245" r="2.4"/><circle cx="760" cy="215" r="2"/>
    <circle cx="850" cy="250" r="2.6"/>
  </g>

  <rect width="900" height="300" fill="url(#scan)"/>

  <rect x="0" y="0" width="900" height="26" fill="#000"/>
  <rect x="0" y="274" width="900" height="26" fill="#000"/>

  <text class="mono rec" x="38" y="62" font-size="15" fill="#ff2d78">● REC</text>
  <text class="mono" x="104" y="62" font-size="15" fill="#7d8f88">00:00:07</text>
  <text class="mono" x="742" y="62" font-size="14" fill="#7d8f88">4K · 24FPS</text>
  <text class="mono" x="38" y="258" font-size="13" fill="#5c6d66">LAT -1.286 · LON 36.817</text>
  <text class="mono" x="672" y="258" font-size="13" fill="#5c6d66">AES-256 ✓</text>

  <text class="mono glitchA" x="450" y="168" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="3" fill="#ff2d78">ROBERT WAMBUGU</text>
  <text class="mono glitchB" x="450" y="168" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="3" fill="#22d3ee">ROBERT WAMBUGU</text>
  <text class="mono" x="450" y="168" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="3" fill="#f2fff8" filter="url(#glow)">ROBERT WAMBUGU</text>

  <text class="mono" x="450" y="212" text-anchor="middle" font-size="17" letter-spacing="2" fill="#00ff88">&gt; computer scientist · cybersecurity · web design<tspan class="cursor" fill="#00ff88">▊</tspan></text>

  <text class="mono" x="450" y="248" text-anchor="middle" font-size="14" letter-spacing="4" fill="#22d3ee">— TRANSMISSION: dev-roba.github.io —</text>
</svg>
